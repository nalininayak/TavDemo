version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.8
    steps:
      - checkout
      - run: echo "Building image"

  test:
    docker:
      - image: cimg/python:3.8
    steps:
      - run: echo "Testing phase"

  deploy:
    docker:
      - image: cimg/python:3.8
    steps:
      - run: echo "Deploying application"

workflows:
  build-test-deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test